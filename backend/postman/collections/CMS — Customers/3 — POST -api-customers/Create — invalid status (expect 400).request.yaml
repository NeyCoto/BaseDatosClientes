$kind: http-request
url: "{{baseUrl}}/api/customers"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "first_name": "Test",
      "last_name": "Status",
      "email": "test.status@example.com",
      "status": "invalid_status"
    }
order: 5000
