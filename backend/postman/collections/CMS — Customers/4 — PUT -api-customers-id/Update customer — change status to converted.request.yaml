$kind: http-request
url: "{{baseUrl}}/api/customers/{{customerId}}"
method: PUT
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "first_name": "John",
      "last_name": "Doe",
      "email": "john.doe.updated@example.com",
      "status": "converted",
      "campaign_id": "{{campaignId}}"
    }
order: 2000
