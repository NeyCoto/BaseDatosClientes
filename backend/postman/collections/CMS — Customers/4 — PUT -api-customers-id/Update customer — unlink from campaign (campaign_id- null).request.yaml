$kind: http-request
name: "Update customer — unlink from campaign (campaign_id: null)"
url: "{{baseUrl}}/api/customers/{{customerId}}"
method: PUT
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "first_name": "John",
      "last_name": "Doe",
      "email": "john.doe.updated@example.com",
      "status": "active",
      "campaign_id": null
    }
order: 3000
